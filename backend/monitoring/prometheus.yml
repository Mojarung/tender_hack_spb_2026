global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    project: pricepulse
    env: hackathon

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: orchestrator }

  - job_name: arq-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8081"]
        labels: { service: worker }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
