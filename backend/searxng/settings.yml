# SearXNG settings for the PricePulse 4th source.
# Mounted into /etc/searxng/settings.yml — see backend/docker-compose.yml.
#
# Why this file is here at all: the SearXNG default config exposes only
# HTML output. The runet scraper (backend/src/pricepulse/scrapers/runet.py)
# needs JSON to parse results programmatically, so we override
# `search.formats` to include `json`.

use_default_settings: true

server:
  secret_key: "pricepulse-searxng-dev-secret-change-me"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json
  language: "ru-RU"
  safe_search: 0

ui:
  default_theme: simple

# Yandex.Поиск API is explicitly banned by the hackathon methodology
# (final_presa.pdf p.5), so we keep SearXNG away from Yandex altogether.
#
# The default engine pool (Brave/Google/DuckDuckGo/Startpage) rate-limits
# aggressively — after a handful of queries Brave shows "Suspended: too
# many requests" and the rest serve CAPTCHA, leaving the 4th source with
# 0 candidate URLs. Mojeek + Qwant tolerate moderate volume without
# captcha and round out the candidate pool when the others sleep it off.
engines:
  - name: yandex
    disabled: true
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: presearch
    disabled: false
