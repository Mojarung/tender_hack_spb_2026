[project]
name = "pricepulse"
version = "0.1.0"
description = "Intelligent open-source price search service for the Moscow Suppliers Portal"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PricePulse team" }]

dependencies = [
    # ===== Web framework =====
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    # ===== Validation / settings =====
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # ===== HTTP (cascading L1 of anti-bot stack) =====
    "httpx[http2]>=0.28",
    "curl-cffi>=0.7",           # TLS impersonation (chrome131), HTTP/2+3
    "tenacity>=9.0",
    # ===== Browser (L2 for YandexMarket XHR interception) =====
    "playwright>=1.49",
    # ===== 4-th source =====
    "firecrawl-py>=2.0",
    # ===== Storage =====
    "redis>=5.2",
    "arq>=0.26",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",          # dev fallback when Postgres is not running
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aioboto3>=13.0",
    # ===== Auth (registration / favorites) =====
    "fastapi-users[sqlalchemy]>=14.0",
    # ===== Agent: MCP tool server + chatbot =====
    "fastmcp>=3.2",
    # ===== NLP / fuzzy =====
    "rapidfuzz>=3.10",
    # ===== Observability =====
    "prometheus-fastapi-instrumentator>=7.1",
    "prometheus-client>=0.22",
    "structlog>=24.4",
    "orjson>=3.10",
    "symspellpy>=6.9.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
# L2 stealth browser — installed only when actively driving a real
# browser. nodriver is CDP-direct (no WebDriver) and AGPL-3.0; see
# antibot/browser_pool.py. Install with `uv sync --extra stealth`.
stealth = [
    "nodriver>=0.50",
]
# Russian NLP / sentiment — adds ~1.5 GB of torch wheels, install on demand.
nlp = [
    "pymorphy3>=2.0",
    "symspellpy>=6.7",
    "transformers>=4.46",
    "torch>=2.5",
]
# CAPTCHA solving (only used if FEATURE_USE_2CAPTCHA=true).
captcha = [
    "2captcha-python>=1.5",
    "opencv-python-headless>=4.10",
    "primp>=0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepulse"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "ASYNC",
    "S",
    "C4",
    "RUF",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit real external services (skipped by default)",
]
addopts = "-m 'not live'"
