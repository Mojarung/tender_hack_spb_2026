[project]
name = "pricepulse"
version = "0.1.0"
description = "Intelligent open-source price search service for the Moscow Suppliers Portal"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PricePulse team" }]

dependencies = [
    # ===== Web framework =====
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    # ===== Validation / settings =====
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # ===== HTTP (cascading L1 of anti-bot stack) =====
    "httpx[http2]>=0.28",
    "curl-cffi>=0.7",           # TLS impersonation (chrome131), HTTP/2+3
    # 4-th source — self-hosted SearXNG + own JSON-LD parser, no third-party API.
    # See scrapers/runet.py. (Firecrawl removed: methodology p.5 bans external APIs.)
    # ===== Storage =====
    "redis>=5.2",
    "arq>=0.26",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",          # dev fallback when Postgres is not running
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aioboto3>=13.0",
    # ===== Auth (registration / favorites) =====
    "fastapi-users[sqlalchemy]>=14.0",
    # ===== Agent: MCP tool server + chatbot =====
    "fastmcp>=3.2",
    # ===== NLP / fuzzy (core — query normalisation needs these) =====
    "rapidfuzz>=3.10",
    "pymorphy3>=2.0",           # RU lemmatization (dictionary-based, no torch)
    "pymorphy3-dicts-ru",       # Russian dictionary for pymorphy3
    # ===== Observability =====
    "prometheus-fastapi-instrumentator>=7.1",
    "prometheus-client>=0.22",
    "structlog>=24.4",
    "orjson>=3.10",
    # ===== L2 stealth browser (Ozon path always needs it) =====
    # nodriver — CDP-direct, no WebDriver. 28/3/0 vs Cloudflare in the
    # May-2026 anti-detect benchmark (best of any OSS tool). AGPL-3.0;
    # not a concern for the hackathon project. Used by antibot/browser_pool.py
    # to warm Ozon's anti-bot cookies (see antibot/browser_fetch.py).
    "nodriver>=0.50",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepulse"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120          # bumped from 100 — Russian strings, Pydantic Field defaults, dataclass init lines
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "ASYNC",
    "S",
    "C4",
    "RUF",
]
ignore = [
    "S101",   # assert in tests is fine
    "B008",   # FastAPI / typer use `def f(x = Depends(...))` idiomatically
    "RUF001", # Russian project — Cyrillic chars that look like Latin are intentional
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/pricepulse/config.py" = ["S105"]            # dev-default credentials (overridden by env in prod)
"src/pricepulse/core/exceptions.py" = ["N818"]   # `RateLimited`, `CaptchaChallenge` — domain names without Error suffix
"src/pricepulse/antibot/fingerprints.py" = ["S311"]  # non-cryptographic UA / viewport choice

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit real external services (skipped by default)",
]
addopts = "-m 'not live'"
