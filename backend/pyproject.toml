[project]
name = "pricepulse"
version = "0.1.0"
description = "Intelligent open-source price search service for the Moscow Suppliers Portal"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PricePulse team" }]

dependencies = [
    # ===== Web framework =====
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    # ===== Validation / settings =====
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # ===== HTTP (cascading L1 of anti-bot stack) =====
    "httpx[http2]>=0.28",
    "curl-cffi>=0.7",           # TLS impersonation (chrome131), HTTP/2+3
    "tenacity>=9.0",
    # ===== 4-th source =====
    "firecrawl-py>=2.0",
    # ===== Storage =====
    "redis>=5.2",
    "arq>=0.26",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aioboto3>=13.0",
    # ===== NLP / fuzzy =====
    "rapidfuzz>=3.10",
    # ===== Observability =====
    "prometheus-fastapi-instrumentator>=7.1",
    "prometheus-client>=0.22",
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
# Heavier stealth stack — installed only when actively driving real
# browsers (otherwise we don't need them). Pin loosely; lock them at
# integration time via `uv add patchright camoufox` etc.
stealth = [
    "patchright",
    "camoufox",
    "nodriver",
    "humancursor",
]
# Russian NLP / sentiment — adds ~1.5 GB of torch wheels, install on demand.
nlp = [
    "pymorphy3>=2.0",
    "symspellpy>=6.7",
    "transformers>=4.46",
    "torch>=2.5",
]
# CAPTCHA solving (only used if FEATURE_USE_2CAPTCHA=true).
captcha = [
    "2captcha-python>=1.5",
    "opencv-python-headless>=4.10",
    "primp>=0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepulse"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "ASYNC",
    "S",
    "C4",
    "RUF",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit real external services (skipped by default)",
]
addopts = "-m 'not live'"
