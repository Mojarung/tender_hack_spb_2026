name: pricepulse

services:
  # ===== Core application =====
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks: [pricepulse]

  worker:
    build: .
    env_file: .env
    command: ["arq", "pricepulse.queue.tasks.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [pricepulse]

  # ===== Storage =====
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pricepulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    networks: [pricepulse]

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    networks: [pricepulse]

  # ===== Image cache (S3-compatible) =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pricepulse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pricepulse_dev_password}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    networks: [pricepulse]

  # One-shot bucket creator
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-pricepulse} ${S3_SECRET_KEY:-pricepulse_dev_password} &&
      mc mb -p local/${S3_BUCKET:-pricepulse-images} &&
      mc anonymous set download local/${S3_BUCKET:-pricepulse-images} &&
      mc ilm rule add --expire-days 30 local/${S3_BUCKET:-pricepulse-images} || true
      "
    networks: [pricepulse]

  # ===== 4th source: self-hosted SearXNG =====
  # Firecrawl (self-hosted) was removed — methodology p.5 bans external
  # APIs, and our runet scraper now parses JSON-LD directly from the URLs
  # SearXNG returns. See backend/src/pricepulse/scrapers/runet.py.

  searxng:
    image: searxng/searxng:latest
    environment:
      BASE_URL: http://localhost:8080
      INSTANCE_NAME: pricepulse-searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8080:8080"
    networks: [pricepulse]

  # Russian spell-correction microservice — SAGE FRED-T5 distilled-95M
  # (backend/spellcheck/). Self-hosted transformer trained by SberDevices
  # for Russian spelling, used by enrichment/normalize.py.
  spellcheck:
    build: ./spellcheck
    ports:
      - "8095:8080"
    networks: [pricepulse]
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request as u; u.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s    # SAGE T5 takes ~15-30s to load on first boot
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    networks: [pricepulse]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [pricepulse]

  # ===== Local LLM (Gemma 4) for CAPTCHA + 4th-source extraction =====
  #
  # **Microservice, GPU-host friendly.** В проде Ollama поднимается на отдельной
  # машине с GPU, backend ходит к нему по HTTP через `OLLAMA_URL`. Compose-блок
  # ниже — только для локального dev (`docker compose --profile gpu up -d ollama`),
  # CPU-инференс для vision слишком медленный.
  #
  # First-time setup on the chosen Ollama host:
  #     ollama pull gemma4:e4b
  ollama:
    image: ollama/ollama:latest
    profiles: ["gpu"]                # opt-in: not started by default
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # NVIDIA Container Toolkit required on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks: [pricepulse]

  # ===== Notifications =====
  ntfy:
    image: binwiederhier/ntfy:latest
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://localhost:8090
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_DEFAULT_ACCESS: read-write
    volumes:
      - ntfydata:/var/cache/ntfy
    ports:
      - "8090:80"
    networks: [pricepulse]

  apprise:
    image: caronc/apprise:latest
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: 1
    volumes:
      - apprisedata:/config
    ports:
      - "8082:8000"   # 8082 host → 8000 container (avoid clash with FastAPI :8000)
    networks: [pricepulse]

  # ===== DB UI =====
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pricepulse.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-hackathon}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pricepulse]

  # ===== Container live logs in the browser =====
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    networks: [pricepulse]

  # ===== External-view uptime + status page =====
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptimekumadata:/app/data
    ports:
      - "3001:3001"
    networks: [pricepulse]

  # ===== Error tracking (Sentry-compatible) =====
  glitchtip:
    image: glitchtip/glitchtip:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pricepulse}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-replace_with_openssl_rand_hex_32}
      PORT: "8000"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8001
      DEFAULT_FROM_EMAIL: glitchtip@pricepulse.local
      CELERY_WORKER_AUTOSCALE: "1,3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks: [pricepulse]

  # ===== Admin landing page =====
  # gethomepage.dev — single dashboard with tiles linking to all services
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost:3030"
    volumes:
      - ./homepage:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3030:3000"
    networks: [pricepulse]

  # ===== n8n: orchestration + alerts + live demo board =====
  # Opt-in (`docker compose --profile ops up -d n8n`). Никакой бизнес-логики
  # на n8n не висит — он используется только для алёртов в демо-режиме.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["ops"]
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-hackathon}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-please_change_me_with_openssl_rand_hex_32}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-pricepulse}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-pricepulse}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_POSTGRESDB_SCHEMA: n8n
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"   # 7 days
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks: [pricepulse]

volumes:
  pgdata:
  miniodata:
  promdata:
  n8ndata:
  ollamadata:
  ntfydata:
  apprisedata:
  pgadmindata:
  uptimekumadata:

networks:
  pricepulse:
    driver: bridge
