[project]
name = "google-research"
version = "0.1.0"
description = "Isolated sandbox for Google Shopping SERP scraping experiments — separate uv venv, no overlap with the main backend project."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "nodriver>=0.50",
    "curl_cffi>=0.11",
    "httpx[http2]>=0.28",
    "orjson>=3.10",
]

[tool.uv]
package = false
