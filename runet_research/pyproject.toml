[project]
name = "runet-research"
version = "0.1.0"
description = "Isolated sandbox for Runet (Yandex shopping SERP tab) scraping experiments — separate uv venv, no overlap with the main backend project."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # nodriver — same stealth-browser pattern as Ozon and WB. Yandex SERP
    # has its own anti-bot (SmartCaptcha) that a real headed Chrome glides
    # past while curl_cffi / httpx get a 403 / captcha page.
    "nodriver>=0.50",

    # curl_cffi for any backup HTTP-only probes (e.g. once we know the
    # Yandex /tovary endpoint shape, we may be able to hit it with chrome
    # JA3 + warmed cookies).
    "curl_cffi>=0.11",

    "httpx[http2]>=0.28",
    "orjson>=3.10",
]

[tool.uv]
package = false
