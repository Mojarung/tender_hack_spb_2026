[project]
name = "ozon-research"
version = "0.1.0"
description = "Isolated sandbox for Ozon scraping experiments — separate uv venv, no overlap with the main backend project."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # L1 — TLS-impersonating HTTP client. ≥0.11 is needed for the
    # `chrome131_android` profile (matches the ozonapp_android UA).
    "curl_cffi>=0.11",

    # Slider-CAPTCHA solver: Canny + matchTemplate.
    "opencv-python-headless>=4.10",
    "numpy>=2.0",

    # L2 stealth, two options — both shipped because we measure
    # empirically which one passes Ozon on a given IP/day:
    #
    #   * nodriver — CDP-direct, no Playwright shim. 28/3/0 vs
    #     Cloudflare in May-2026 anti-detect benchmark — the single
    #     best result. AGPL-3.0 (was previously isolated for licence
    #     reasons; not a concern for an internal hackathon project).
    #   * patchright — Apache-2.0 Playwright fork that patches the
    #     Runtime.enable CDP leak. 25/3/3 in the same benchmark.
    "nodriver>=0.50",
    "patchright>=1.55",

    # Fast JSON.
    "orjson>=3.10",
]

[project.optional-dependencies]
# Camoufox — C++-level patched Firefox (~88.6% bypass rate, 0% headless
# detection). HEAVY install: downloads a custom Firefox build (~250 MB).
# Use only when nodriver AND patchright both fail on the target IP:
#   uv sync --extra camoufox
#   uv run camoufox fetch  # one-time browser binary download
camoufox = ["camoufox>=0.4"]

# SeleniumBase UC mode — sync API, but has built-in Cloudflare
# Turnstile / hCaptcha clicker. Last-resort if both nodriver and
# Camoufox fail:
#   uv sync --extra sb
sb = ["seleniumbase>=4.30"]

# Pure-script project — there's no `ozon_research` package to build/install.
[tool.uv]
package = false
